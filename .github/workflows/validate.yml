name: Validate marketplace contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.6"
          enable-cache: false
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups --no-install-project
      - name: Run the documented complete local gate
        run: PYTHONPATH=src uv run --no-sync python scripts/gate.py
